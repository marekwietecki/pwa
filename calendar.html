        <section class="calendar">
            <header class="calendar-header">
                <button id="prevMonth" class="monthArrow">‹</button>
                <h3 id="currentMonth"></h3>
                <button id="nextMonth" class="monthArrow">›</button>
            </header>
            
            <div class="calendar-grid-wrapper">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>

        <section class="tasks">
            <h3 id="taskDateTitle"> </h3>
            <ul id="taskList"></ul>
        </section>

        <button id="addTaskBtn" class="addTaskBtn"> + </button>


        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-sheet">
            <header class="modal-header">
                <h3>Add task</h3>
                <button id="closeModal">✕</button>
            </header>
        
            <input type="text" placeholder="Task name" id="taskName" />
            <input type="date" id="taskDate" />
            
            <input
                type="text"
                id="locationInput"
                placeholder="Enter location (e.g. Hanna, Lubuskie)"
            />
            <button id="searchLocation">📍 Set location</button>
            <button id="locBtn">📍 Use current location</button>


            <button class="primary">Add</button>
            </div>
        </div>
          
        <script>
            // -----------------------
            // Formatting funcitons
            // -----------------------
            function getMondayFirstDay(date) {
                const day = date.getDay(); // 0 = sunday
                return day === 0 ? 6 : day - 1;
            }
        
            function formatDateKey(date) {
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
        
            // -----------------------
            // global variables
            // -----------------------
            let date = new Date(); // aktualny miesiąc dla kalendarza
            let selectedDate = new Date(); // domyślnie dzisiaj
        
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('currentMonth');
        
            const tasks = {
                '2026-01-10': ['Workout', 'Read 10 pages'],
                '2026-01-03': ['Meditation', 'No sugar'],
                '2026-01-04': ['Do homework', 'Practice JS']
            };
        
            // -----------------------
            // calendar rendering funciton
            // -----------------------
            function renderCalendar() {
                grid.innerHTML = '';
        
                label.textContent = date.toLocaleDateString('en-US', {
                    month: 'long',
                    year: 'numeric'
                });
        
                const year = date.getFullYear();
                const month = date.getMonth();
        
                const daysOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
                daysOfWeek.forEach(d => {
                    const el = document.createElement('div');
                    el.textContent = d;
                    el.className = 'day-label';
                    grid.appendChild(el);
                });
        
                // blank spaces before 1st day of the motnh
                const firstDayOfMonth = new Date(year, month, 1);
                const startIndex = getMondayFirstDay(firstDayOfMonth);
        
                for (let i = 0; i < startIndex; i++) {
                    grid.appendChild(document.createElement('div'));
                }
        
                // days of the month
                const daysInMonth = new Date(year, month + 1, 0).getDate();
        
                for (let day = 1; day <= daysInMonth; day++) {
                    const el = document.createElement('div');
                    el.className = 'day';
                    el.textContent = day;
        
                    // kliknięcie → zaznaczenie dnia
                    el.onclick = () => selectDay(year, month, day, el);
        
                    // jeśli to dzisiejsza data (domyślnie)
                    if (
                        selectedDate.getFullYear() === year &&
                        selectedDate.getMonth() === month &&
                        selectedDate.getDate() === day
                    ) {
                        el.classList.add('active');
                    }
        
                    grid.appendChild(el);
                }
        
                renderTasksForDay(selectedDate);
            }
        
            // -----------------------
            // selected day function
            // -----------------------
            function selectDay(year, month, day, element) {
                document.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
                element.classList.add('active');
        
                selectedDate = new Date(year, month, day);
                renderTasksForDay(selectedDate);
            }
        
            // -----------------------
            // tasks for selected day
            // -----------------------
            function renderTasksForDay(date) {
                const title = document.getElementById('taskDateTitle');
                const list = document.getElementById('taskList');

                const key = formatDateKey(date);
                title.textContent = `Tasks for ${date.toDateString()}`;
                list.innerHTML = '';

                // download states from localStorage
                const saved = JSON.parse(localStorage.getItem('tasksState')) || {};
                const dayState = saved[key] || {};

                (tasks[key] || []).forEach((task, index) => {
                    const li = document.createElement('li');

                    // checkbox
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `task-${key}-${index}`; // unique ID
                    checkbox.checked = !!dayState[task]; // state from localStorage
                    checkbox.style.marginRight = '12px';

                    // Label
                    const label = document.createElement('label');
                    label.htmlFor = checkbox.id;
                    label.textContent = task;

                    // Save change to localStorage
                    checkbox.addEventListener('change', () => {
                        const saved = JSON.parse(localStorage.getItem('tasksState')) || {};
                        saved[key] = saved[key] || {};
                        saved[key][task] = checkbox.checked;
                        localStorage.setItem('tasksState', JSON.stringify(saved));
                    });

                    li.appendChild(checkbox);
                    li.appendChild(label);
                    list.appendChild(li);
                });
            }

        
            // -----------------------
            // month arrows navigation
            // -----------------------
            document.getElementById('prevMonth').onclick = () => {
                date.setMonth(date.getMonth() - 1);
                renderCalendar();
            };
        
            document.getElementById('nextMonth').onclick = () => {
                date.setMonth(date.getMonth() + 1);
                renderCalendar();
            };
        
          
            renderCalendar();
        </script>

        
        <script>
            // -----
            // fab show/hide
            // -----
            const openBtn = document.getElementById('addTaskBtn');
            const closeBtn = document.getElementById('closeModal');
            const overlay = document.getElementById('modalOverlay');
            
            openBtn.onclick = () => {
            overlay.classList.add('open');
            };
            
            closeBtn.onclick = () => {
            overlay.classList.remove('open');
            };
            
            // klik w tło
            overlay.onclick = (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('open');
            }
            };
            </script>

            <script>
                // location
                const input = document.getElementById('locationInput');
                const geoBtn = document.getElementById('locBtn');                
                const searchBtn = document.getElementById('searchLocation');
              
                let selectedLocation = null;
              
                // 🔹 wspólna funkcja ustawiania lokalizacji
                function setLocation(location) {
                  selectedLocation = location;
                  input.value = location.name;
                  input.classList.remove('error');
                  input.classList.add('success');
              
                  console.log('Location set:', selectedLocation);
                }
              
                function clearLocation() {
                  selectedLocation = null;
                  input.value = '';
                  input.classList.remove('success');
                  input.classList.add('error');
                }
              
                // 📍 1. Lokalizacja z GPS
                geoBtn.addEventListener('click', () => {
                  if (!navigator.geolocation) {
                    alert('Geolocation not supported');
                    return;
                  }
              
                  navigator.geolocation.getCurrentPosition(
                    async (position) => {
                      const { latitude, longitude } = position.coords;
              
                      try {
                        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`;
                        const res = await fetch(url);
                        const data = await res.json();
              
                        if (!data || !data.display_name) {
                          clearLocation();
                          return;
                        }
              
                        setLocation({
                          name: data.display_name,
                          lat: latitude,
                          lng: longitude
                        });
              
                      } catch {
                        clearLocation();
                      }
                    },
                    () => clearLocation()
                  );
                });
              
                // ⌨️ 2. Lokalizacja z inputa (tekst)
                searchBtn.addEventListener('click', async () => {
                  const query = input.value.trim();
                  if (!query) return;
              
                  try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
                    const res = await fetch(url);
                    const data = await res.json();
              
                    if (!data.length) {
                      clearLocation();
                      return;
                    }
              
                    const place = data[0];
              
                    setLocation({
                      name: place.display_name,
                      lat: parseFloat(place.lat),
                      lng: parseFloat(place.lon)
                    });
              
                  } catch {
                    clearLocation();
                  }
                });
              </script>
