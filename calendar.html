        <section class="calendar">
            <header class="calendar-header">
                <button id="prevMonth" class="monthArrow">‹</button>
                <h3 id="currentMonth"></h3>
                <button id="nextMonth" class="monthArrow">›</button>
            </header>
            
            <div class="calendar-grid-wrapper">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>

        <div class="helper320"></div>

        <section class="tasks">
            <h3 id="taskDateTitle"> </h3>
            <div class="taskListWrapper">
                <ul id="taskList"></ul>
            </div>
        </section>

        <button id="addTaskBtn" class="addTaskBtn"> + </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-sheet">
                <header class="modal-header">
                    <h3>Add task</h3>
                    <button id="closeModal">✕</button>
                </header>
            
                <input type="text" placeholder="Task name" id="taskName" />
                <input type="date" id="taskDate" />
                <div style="flex: 1">
                    <input
                        type="text"
                        id="locationInput"
                        placeholder="Enter location (e.g. Hanna, Lubuskie)"
                    />
                    <button id="searchLocation">✔️</button>
                    <button id="useMyLocation">📍 Current Location</button>
                </div>


                <button class="addTask">Add</button>
            </div>
        </div>
          
        <script>
            // -----------------------
            // Formatting funcitons
            // -----------------------
            function getMondayFirstDay(date) {
                const day = date.getDay(); // 0 = sunday
                return day === 0 ? 6 : day - 1;
            }
        
            function formatDateKey(date) {
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
        
            function formatLocation(address) {
                if (!address) return '';

                const street =
                    address.road ||
                    address.pedestrian ||
                    address.cycleway ||
                    address.footway;

                const houseNumber = address.house_number;

                const city =
                    address.city ||
                    address.town ||
                    address.village ||
                    address.hamlet;

                const country = address.country;

                if (street && houseNumber && city) {
                    return `${street} ${houseNumber}, ${city}`;
                }

                if (street && city) {
                    return `${street}, ${city}`;
                }

                if (city && country) {
                    return `${city}, ${country}`;
                }

                if (country) {
                    return country;
                }

                return '';
            }

            // -----------------------
            // global variables
            // -----------------------
            let date = new Date(); // aktualny miesiąc dla kalendarza
            let selectedDate = new Date(); // domyślnie dzisiaj
        
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('currentMonth');
        
            // -----------------------
            // calendar rendering funciton
            // -----------------------
            function renderCalendar() {
                grid.innerHTML = '';
        
                label.textContent = date.toLocaleDateString('en-US', {
                    month: 'long',
                    year: 'numeric'
                });
        
                const year = date.getFullYear();
                const month = date.getMonth();
        
                const daysOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
                daysOfWeek.forEach(d => {
                    const el = document.createElement('div');
                    el.textContent = d;
                    el.className = 'day-label';
                    grid.appendChild(el);
                });
        
                // blank spaces before 1st day of the motnh
                const firstDayOfMonth = new Date(year, month, 1);
                const startIndex = getMondayFirstDay(firstDayOfMonth);
        
                for (let i = 0; i < startIndex; i++) {
                    grid.appendChild(document.createElement('div'));
                }
        
                // days of the month
                const daysInMonth = new Date(year, month + 1, 0).getDate();
        
                for (let day = 1; day <= daysInMonth; day++) {
                    const el = document.createElement('div');
                    el.className = 'day';
                    el.textContent = day;
        
                    // kliknięcie → zaznaczenie dnia
                    el.onclick = () => selectDay(year, month, day, el);
        
                    // jeśli to dzisiejsza data (domyślnie)
                    if (
                        selectedDate.getFullYear() === year &&
                        selectedDate.getMonth() === month &&
                        selectedDate.getDate() === day
                    ) {
                        el.classList.add('active');
                    }
        
                    grid.appendChild(el);
                }
        
                renderTasksForDay(selectedDate);
            }
        
            // -----------------------
            // selected day function
            // -----------------------
            function selectDay(year, month, day, element) {
                document.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
                element.classList.add('active');
        
                selectedDate = new Date(year, month, day);
                renderTasksForDay(selectedDate);
            }
        
            // -----------------------
            // tasks for selected day
            // -----------------------
            function renderTasksForDay(date) {
            const title = document.getElementById('taskDateTitle');
            const list = document.getElementById('taskList');

            const key = formatDateKey(date);
            title.textContent = `Tasks for ${date.toDateString()}`;
            list.innerHTML = '';

            // Pobierz zadania z localStorage
            const saved = JSON.parse(localStorage.getItem('tasksState')) || {};
            const dayState = saved[key] || {}; // obiekt { taskName: {done: false, location: ...} }

            const tasks = Object.entries(dayState).sort(([, a], [, b]) => {
                return (a.done === b.done) ? 0 : a.done ? 1 : -1;
            });

            tasks.forEach(([taskName, taskData], index) => {
                const li = document.createElement('li');

                if (taskData.done) {
                    li.classList.add('done');
                }

                // checkbox
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `task-${key}-${index}`;
                checkbox.checked = !!dayState[taskName].done;
                checkbox.style.marginRight = '12px';

                // Label tylko z nazwą zadania
                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = taskName;
                label.classList.add('taskLabel');

                // osobny element dla lokalizacji
                let locationSpan = null;
                if (dayState[taskName].location) {
                    locationSpan = document.createElement('span');
                    locationSpan.textContent = `📍 ${dayState[taskName].location}`;
                    locationSpan.classList.add('taskLocation');
                }

                // zapis zmian w localStorage
                checkbox.addEventListener('change', () => {
                    const saved = JSON.parse(localStorage.getItem('tasksState')) || {};
                    saved[key] = saved[key] || {};
                    saved[key][taskName].done = checkbox.checked;
                    localStorage.setItem('tasksState', JSON.stringify(saved));

                    renderTasksForDay(selectedDate);
                });

                li.classList.add('taskItem');
                label.classList.add('taskLabel');
                checkbox.classList.add('taskCheckbox');

                li.appendChild(label);
                li.appendChild(checkbox);
                list.appendChild(li);
            });
        }


        
            // -----------------------
            // month arrows navigation
            // -----------------------
            document.getElementById('prevMonth').onclick = () => {
                date.setMonth(date.getMonth() - 1);
                renderCalendar();
            };
        
            document.getElementById('nextMonth').onclick = () => {
                date.setMonth(date.getMonth() + 1);
                renderCalendar();
            };
        
          
            renderCalendar();
        </script>

        <script>
            // ------------------------------
            // Location inside add task modal
            // ------------------------------
            const input = document.getElementById('locationInput');
            const searchBtn = document.getElementById('searchLocation');
            const geoBtn = document.getElementById('useMyLocation');

            let selectedLocation = null;

            // After Input
            searchBtn.addEventListener('click', async () => {
            const query = input.value.trim();
            if (!query) return;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(query)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (!data.length) {
                    input.value = '';
                    input.classList.remove('success');
                    input.classList.add('error');
                    selectedLocation = null;
                    alert('Location not found');
                    return;
                }

                const place = data[0];
                const shortName = formatLocation(place.address);

                selectedLocation = {
                    name: shortName || place.display_name,
                    lat: parseFloat(place.lat),
                    lng: parseFloat(place.lon)
                };

                input.value = selectedLocation.name;

                input.classList.remove('error');
                input.classList.add('success');
                console.log('Saved location:', selectedLocation);

            } catch (e) {
                console.error('Search location error', e);
                input.value = '';
                selectedLocation = null;
            }
            });

            // Location from Device's GPS
            geoBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Geolocation not supported');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                const { latitude, longitude } = position.coords;
                console.log('GPS coords:', latitude, longitude);

                try {
                    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (!data || !data.display_name) {
                        input.value = '';
                        selectedLocation = null;
                        alert('Location not found');
                        return;
                    }

                    const shortName = formatLocation(data.address);

                    selectedLocation = {
                        name: shortName || data.display_name,
                        lat: parseFloat(place.lat),
                        lng: parseFloat(place.lon)
                    };

                    input.value = selectedLocation.name;

                    input.classList.remove('error');
                    input.classList.add('success');

                    console.log('Location set:', selectedLocation);

                } catch (e) {
                    console.error('Reverse geocoding failed', e);
                    input.value = '';
                    selectedLocation = null;
                }
                },
                (err) => {
                console.error('Geolocation error:', err);
                alert('Could not get location. Make sure you allowed it.');
                input.value = '';
                selectedLocation = null;
                }
            );
            });
        </script>
              
        <script>
            // FAB 
            const fabBtn = document.getElementById('addTaskBtn'); 
            const closeBtn = document.getElementById('closeModal');
            const overlay = document.getElementById('modalOverlay');

            fabBtn.addEventListener('click', () => overlay.classList.add('open'));
            closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
            overlay.addEventListener('click', e => {
                if (e.target === overlay) overlay.classList.remove('open');
            });

            // adding a task
            const addTaskModalBtn = document.querySelector('.addTask');
            const taskNameInput = document.getElementById('taskName');
            const taskDateInput = document.getElementById('taskDate');
            const locationInput = document.getElementById('locationInput');

            addTaskModalBtn.addEventListener('click', () => {
                const name = taskNameInput.value.trim();
                if (!name) return alert('Enter task name');

                const dateStr = taskDateInput.value || formatDateKey(selectedDate); // if no date is provided date will be set for today
                const location = locationInput.value.trim();

                const saved = JSON.parse(localStorage.getItem('tasksState')) || {};
                saved[dateStr] = saved[dateStr] || {};
                saved[dateStr][name] = { done: false, location: location || null };
                localStorage.setItem('tasksState', JSON.stringify(saved));

                taskNameInput.value = '';
                taskDateInput.value = '';
                locationInput.value = '';
                overlay.classList.remove('open');

                selectedDate = new Date(dateStr);
                renderCalendar();
            });
        </script>
