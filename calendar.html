<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Plan your future and review your past. Use our interactive calendar to schedule upcoming goals and analyze your task history with ease.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar - Habit Hero</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="manifest" href="./manifest.webmanifest">
    </head>
    <body>
        <header class="navbar">
            <h1 class="logo">Habit Hero</h1>
            <nav class="tabNav">
                <a href="/index.html" class="tabNavItem">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="navIcon" id="lucide-clipboard-check">
                        <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <path d="m9 14 2 2 4-4"/>
                    </svg>
                    Today
                </a>
                <a href="/calendar.html" class="tabNavItemSelected">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="navIcon" id="lucide-calendar-days">
                        <path d="M8 2v4"/>
                        <path d="M16 2v4"/>
                        <rect width="18" height="18" x="3" y="4" rx="2"/>
                        <path d="M3 10h18"/>
                        <path d="M8 14h.01"/>
                        <path d="M12 14h.01"/>
                        <path d="M16 14h.01"/>
                        <path d="M8 18h.01"/>
                        <path d="M12 18h.01"/>
                        <path d="M16 18h.01"/>
                    </svg>
                    Calendar
                </a>
                <a href="/habits.html" class="tabNavItem">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-flame-icon lucide-flame">
                        <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>
                    </svg>
                    Habits
                </a>
                <a href="/hero.html" class="tabNavItem">
                    <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="20" 
                    height="20" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    class="lucide lucide-user-icon lucide-user">
                      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                      <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Hero
                  </a>
            </nav>
        </header>

        <!-- CALENDAR -->
        <section class="calendar">
            <header class="calendar-header">
                <button id="prevMonth" class="monthArrow">‹</button>
                <h3 id="currentMonth"></h3>
                <button id="nextMonth" class="monthArrow">›</button>
            </header>
            
            <div class="calendar-grid-wrapper">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </section>

        <div class="helper320"></div>

        <section class="toDo">
            <h3 id="taskDateTitle"></h3>
            <div class="toDoListWrapper">
              <ul id="toDoList"></ul>
            </div>
        </section>
    
    
        <!-- MODAL -->
        <button id="addTaskBtn" class="addTaskBtn"> + </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-sheet">
                <header class="modal-header">
                    <div class="typePickers">
                        <h3>Add new</h3>
                        <button class="typePicker" data-type="task">Task</button>
                        <button class="typePicker" data-type="habit">Habit</button>
                        <button class="typePicker" data-type="goal">Goal</button>
                    </div>
                    <button id="closeModal">✕</button>
                </header>
          
                <div id="habitSection" style="display:none;">
                    <select id="habitFrequency">
                        <option value="daily">Codziennie</option>
                        <option value="weekly">Raz w tygodniu</option>
                        <option value="monthly">Raz w miesiącu</option>
                        <option value="specific">Konkretne dni tygodnia</option>
                    </select>
                    
                    <div id="daysPicker" style="display:none;">
                        <label><input type="checkbox" value="1"> Pon</label>
                        <label><input type="checkbox" value="2"> Wt</label>
                        <label><input type="checkbox" value="3"> Śr</label>
                        <label><input type="checkbox" value="4"> Czw</label>
                        <label><input type="checkbox" value="5"> Pt</label>
                        <label><input type="checkbox" value="6"> Sob</label>
                        <label><input type="checkbox" value="0"> Niedz</label>
                    </div>
                </div>
            
                <input type="text" placeholder="Task name" id="taskName" />
                <div id="taskDateSection">
                    <input type="date" id="taskDate" />
                </div>
                <div style="flex: 1">
                    <input
                        type="text"
                        id="locationInput"
                        placeholder="Enter location"
                    />
                    <button id="searchLocation">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-search-check">
                            <path d="m8 11 2 2 4-4"/>
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                    </button>
                    <button id="useMyLocation">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-locate">
                            <line x1="2" x2="5" y1="12" y2="12"/>
                            <line x1="19" x2="22" y1="12" y2="12"/>
                            <line x1="12" x2="12" y1="2" y2="5"/>
                            <line x1="12" x2="12" y1="19" y2="22"/>
                            <circle cx="12" cy="12" r="7"/>
                        </svg>
                        Current Location
                    </button>
                </div>

                <button class="addTask">Add</button>
            </div>
        </div>
                
        <script src="./app.js"></script>

        <script>
            if('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('SW register success', reg.scope))
                        .catch(err => console.error('SW register failed', err))
                })
            }
        </script>
    </body>
</html>
