<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Plan your future and review your past. Use our interactive calendar to schedule upcoming goals and analyze your task history with ease."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calendar - Habit Bubbl" />
    <meta
      property="og:description"
      content="Master your daily productivity with Habit Bubbl. Track daily tasks, complete habits in real-time."
    />
    <meta property="og:url" content="https://habitbubbl.netlify.app/calendar" />
    <meta
      property="og:image"
      content="https://habitbubbl.netlify.app/assets/graphics/og-image-calendar.webp"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calendar - Habit Bubbl" />
    <meta
      name="twitter:description"
      content="Master your daily productivity with Habit Bubbl. Track daily tasks, complete habits in real-time."
    />
    <meta
      name="twitter:image"
      content="https://habitbubbl.netlify.app/assets/graphics/og-image-calendar.webp"
    />
    <title>Calendar - Habit Bubbl</title>
    <link rel="stylesheet" href="./css/global.min.css" />
    <link rel="stylesheet" href="./css/index.min.css" />
    <link rel="stylesheet" href="./css/calendar.min.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/icons/habitbubbl-favicon.svg"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/assets/icons/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="offline-banner">
      No internet connection. App is working in an offline mode.
    </div>
    <header class="navbar">
      <a href="/index.html" class="logo" aria-label="Habit Bubbl">
        <img
          src="./assets/icons/logo-transparent.webp"
          alt=""
          class="logo-img"
          width="64"
          height="64"
        />
      </a>
      <nav class="tabNav">
        <div class="tabNavIndicator" id="tabIndicator"></div>
        <a href="/index.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-list-todo-icon lucide-list-todo"
          >
            <path d="M13 5h8" />
            <path d="M13 12h8" />
            <path d="M13 19h8" />
            <path d="m3 17 2 2 4-4" />
            <rect x="3" y="4" width="6" height="6" rx="1" />
          </svg>
          Today
        </a>
        <a href="/calendar.html" class="tabNavItem active">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-calendar-days"
          >
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          Calendar
        </a>
        <a href="/habits.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-flame-icon lucide-flame"
          >
            <path
              d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            />
          </svg>
          Habits
        </a>
        <a href="/hero.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-user-icon lucide-user"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Hero
        </a>
      </nav>
    </header>
    <main id="main-content">
      <!-- CALENDAR -->
      <section class="calendar">
        <header class="calendar-header">
          <button id="prevMonth" class="monthArrow" aria-label="Previous month">
            ‹
          </button>
          <h3 id="currentMonth"></h3>
          <button id="nextMonth" class="monthArrow" aria-label="Next month">
            ›
          </button>
        </header>

        <div class="calendar-grid-wrapper">
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="week-view">
          <div class="month-year-dropdown-container" id="monthYearDropdownContainer">
            <button
              class="month-year-trigger"
              id="monthYearTrigger"
              type="button"
              aria-label="Choose month and year"
            >
              <span id="weekMonthYearLabel"></span>
              <svg
                class="dropdown-chevron"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div
              class="month-year-dropdown-list"
              id="monthYearDropdownList"
              tabindex="0"
            ></div>
          </div>

          <div class="week-day-labels" id="weekDayLabels"></div>

          <div class="week-strip-row">
            <button id="prevWeek" class="monthArrow" aria-label="Previous week">
              ‹
            </button>
            <div class="week-strip" id="weekStrip"></div>
            <button id="nextWeek" class="monthArrow" aria-label="Next week">
              ›
            </button>
          </div>
        </div>
      </section>

      <section class="calendarToDo">
        <h3 id="calendarTaskDateTitle"></h3>
        <div class="calendarToDoListWrapper">
          <div id="calendarEmptyListMessageWrapper" style="display: none">
            <div id="calendarMessageFuture" class="emptyState" style="display: none">
              <div class="emptyState-icon">📅</div>
              <p class="emptyState-title">Nothing planned</p>
              <p class="emptyState-subtitle">No tasks planned for this day.</p>
            </div>
            <div id="calendarMessageToday" class="emptyState" style="display: none">
              <div class="emptyState-icon">🎉</div>
              <p class="emptyState-title">All tasks done!</p>
              <p class="emptyState-subtitle">Keep it up, you're on a roll.</p>
            </div>
          </div>
          <ul id="calendarToDoList"></ul>
        </div>
      </section>
    </main>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <header class="modal-header">
          <div class="typePickersWrapper">
            <h3 id="modalTitle">New</h3>
            <div class="typePickers">
              <button class="typePicker" data-type="task">Task</button>
              <button class="typePicker" data-type="habit">Habit</button>
              <button class="typePicker" data-type="goal">Goal</button>
            </div>
          </div>
          <button id="closeModal" aria-label="Close modal">✕</button>
        </header>

        <div id="modalMessageWrapper" style="display: none">
          <span id="modalMessage" class="modalMessage">message</span>
        </div>

        <div class="nameSection">
          <label class="modalSubTitle" for="taskName">Name</label>
          <input
            type="text"
            placeholder="Enter name"
            id="taskName"
            name="taskName"
            enterkeyhint="done"
          />
        </div>

        <div id="habitSection" style="display: none">
          <div
            id="habitIconWrapper"
            style="display: flex; flex-direction: column"
          >
            <label class="modalSubTitle" for="habitIcon">Icon</label>
            <input
              type="text"
              id="habitIcon"
              placeholder="★"
              name="habitIcon"
              maxlength="2"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div style="display: flex; flex-direction: column">
            <label class="modalSubTitle" for="habitFrequency">Frequency</label>
            <select id="habitFrequency">
              <option value="daily">Everyday</option>
              <option value="weekly">Select days of the week</option>
              <option value="monthly">Select days of the month</option>
            </select>

            <div id="daysPicker" style="display: none">
              <label
                ><input type="checkbox" name="habitDays" value="1" /> MON
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="2" /> TUE
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="3" /> WED
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="4" /> THU
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="5" /> FRI
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="6" /> SAT
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="0" /> SUN
              </label>
            </div>

            <div id="monthlyDayPicker" style="display: none">
              <div id="monthDaysGrid" class="month-selector-grid"></div>
            </div>
          </div>

          <div class="measurableSection">
            <label class="habit-checkbox-row">
              <input type="checkbox" id="habitMeasurableToggle" />
              <span>Make this habit measurable</span>
            </label>
            <div id="measurableFields" class="measurableFieldsRow" hidden>
              <div class="quantitySection">
                <label class="modalSubTitle" for="habitTargetQuantity"
                  >Target quantity</label
                >
                <input
                  type="number"
                  id="habitTargetQuantity"
                  class="modal-text-input"
                  min="1"
                  step="1"
                  placeholder="e.g. 10"
                />
              </div>
              <div class="unitSection">
                <label class="modalSubTitle" for="habitUnit">Unit</label>
                <input
                  type="text"
                  id="habitUnit"
                  class="modal-text-input"
                  maxlength="20"
                  placeholder="e.g. mins, reps"
                />
              </div>
            </div>
          </div>
        </div>

        <div id="goalSection" style="display: none">
          <div class="deadlinePlusLinkHabit">
            <div class="deadlineSection">
              <label class="modalSubTitle" for="goalDeadline">Deadline</label>
              <input type="date" id="goalDeadline" name="goalDeadline" />
            </div>

            <div class="linkHabitSection">
              <label class="modalSubTitle"
                >Link Habits - make goal measurable</label
              >
              <button
                type="button"
                id="goalHabitToggleBtn"
                class="habit-picker-toggle"
              >
                Select habits to link
              </button>
              <div
                id="goalHabitCheckboxList"
                class="habit-checkbox-list"
                hidden
              ></div>
            </div>
          </div>
          <div class="descriptionSection">
            <label class="modalSubTitle" for="descriptionInput">Description</label>
            <textarea
              id="descriptionInput"
              name="descriptionInput"
              placeholder="Any more details about your goal?"
            ></textarea>
          </div>
        </div>

        <div id="dateSection">
          <label class="modalSubTitle" for="taskDate">Date</label>
          <input type="date" id="taskDate" name="taskDate" />
        </div>
        <div class="locationSection" id="locationSection">
          <label class="modalSubTitle" for="locationInput">Location</label>
          <div class="locationContentWrapper">
            <input
              type="text"
              id="locationInput"
              name="locationInput"
              placeholder="Enter location"
              enterkeyhint="search"
            />
            <button id="searchLocation" aria-label="Search location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide-search-check"
              >
                <path d="m8 11 2 2 4-4" />
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </button>
            <button id="useMyLocation" aria-label="Use my current location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide-locate"
              >
                <line x1="2" x2="5" y1="12" y2="12" />
                <line x1="19" x2="22" y1="12" y2="12" />
                <line x1="12" x2="12" y1="2" y2="5" />
                <line x1="12" x2="12" y1="19" y2="22" />
                <circle cx="12" cy="12" r="7" />
              </svg>
              <!--Current Location-->
            </button>
          </div>
        </div>

        <button class="addTask" id="confirmAddBtn">Create</button>
      </div>
    </div>

    <button
      type="button"
      id="addTaskBtn"
      class="addTaskBtn"
      aria-label="Add new task"
    >
      +
    </button>

    <div id="levelUpToast" class="level-up-toast">
      <div class="level-up-glow"></div>
      <div class="level-up-content">
        <div class="level-up-icon">🫧</div>
        <div class="level-up-text">
          <span class="level-up-subtitle">LEVEL UP!</span>
          <span class="level-up-title">You just achieved higher level!</span>
        </div>
      </div>
    </div>

    <div class="modal-overlay confirm-dialog-overlay" id="confirmDialogOverlay">
      <div class="modal-sheet confirm-dialog-sheet">
        <p id="confirmDialogMessage" class="confirm-dialog-message"></p>
        <div class="confirm-dialog-actions">
          <button
            type="button"
            id="confirmDialogCancelBtn"
            class="confirm-dialog-btn confirm-dialog-cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            id="confirmDialogConfirmBtn"
            class="confirm-dialog-btn confirm-dialog-confirm"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="habitProgressOverlay">
      <div class="modal-sheet habit-progress-sheet">
        <div class="habit-progress-header">
          <span id="habitProgressIcon" class="habit-progress-icon">💧</span>
          <h3 id="habitProgressName" class="habit-progress-name">Habit</h3>
        </div>
        <p class="habit-progress-date" id="habitProgressDateLabel"></p>

        <div class="habit-progress-track">
          <div id="habitProgressBarFill" class="habit-progress-fill"></div>
        </div>

        <div class="habit-progress-stepper">
          <button
            type="button"
            id="habitProgressDecBtn"
            class="habit-progress-step-btn"
            aria-label="Decrease"
          >
            −
          </button>
          <div class="habit-progress-amount-wrap">
            <input
              type="number"
              id="habitProgressAmountInput"
              class="habit-progress-amount-input"
              min="0"
            />
            <span class="habit-progress-target-label"
              >/ <span id="habitProgressTarget"></span>
              <span id="habitProgressUnit"></span
            ></span>
          </div>
          <button
            type="button"
            id="habitProgressIncBtn"
            class="habit-progress-step-btn"
            aria-label="Increase"
          >
            +
          </button>
        </div>

        <div class="confirm-dialog-actions">
          <button
            type="button"
            id="habitProgressCancelBtn"
            class="confirm-dialog-btn confirm-dialog-cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            id="habitProgressSaveBtn"
            class="confirm-dialog-btn confirm-dialog-confirm"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
