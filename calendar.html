<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BetterMe</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="manifest" href="./manifest.webmanifest">
    </head>
    <body>
        <header class="navbar">
            <h1 class="logo">Habit Hero</h1>
            <nav>
                <a href="/index.html">Dashboard</a>
                <a href="/calendar.html">Calendar</a>
                <a href="#">Friends</a>
            </nav>
        </header>

        <section class="calendar">
            <header class="calendar-header">
                <button id="prevMonth" class="monthArrow">‹</button>
                <h3 id="currentMonth"></h3>
                <button id="nextMonth" class="monthArrow">›</button>
            </header>
            
            <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <section class="tasks">
            <h3 id="taskDateTitle">Tasks: </h3>
            <ul id="taskList"></ul>
        </section>
          
        <script>
            // -----------------------
            // Formatting funcitons
            // -----------------------
            function getMondayFirstDay(date) {
                const day = date.getDay(); // 0 = sunday
                return day === 0 ? 6 : day - 1;
            }
        
            function formatDateKey(date) {
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
        
            // -----------------------
            // global variables
            // -----------------------
            let date = new Date(); // aktualny miesiąc dla kalendarza
            let selectedDate = new Date(); // domyślnie dzisiaj
        
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('currentMonth');
        
            const tasks = {
                '2026-01-10': ['Workout', 'Read 10 pages'],
                '2026-01-03': ['Meditation', 'No sugar'],
                '2026-01-04': ['Do homework', 'Practice JS']
            };
        
            // -----------------------
            // calendar rendering funciton
            // -----------------------
            function renderCalendar() {
                grid.innerHTML = '';
        
                label.textContent = date.toLocaleDateString('en-US', {
                    month: 'long',
                    year: 'numeric'
                });
        
                const year = date.getFullYear();
                const month = date.getMonth();
        
                const daysOfWeek = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
                daysOfWeek.forEach(d => {
                    const el = document.createElement('div');
                    el.textContent = d;
                    el.className = 'day-label';
                    grid.appendChild(el);
                });
        
                // blank spaces before 1st day of the motnh
                const firstDayOfMonth = new Date(year, month, 1);
                const startIndex = getMondayFirstDay(firstDayOfMonth);
        
                for (let i = 0; i < startIndex; i++) {
                    grid.appendChild(document.createElement('div'));
                }
        
                // days of the month
                const daysInMonth = new Date(year, month + 1, 0).getDate();
        
                for (let day = 1; day <= daysInMonth; day++) {
                    const el = document.createElement('div');
                    el.className = 'day';
                    el.textContent = day;
        
                    // kliknięcie → zaznaczenie dnia
                    el.onclick = () => selectDay(year, month, day, el);
        
                    // jeśli to dzisiejsza data (domyślnie)
                    if (
                        selectedDate.getFullYear() === year &&
                        selectedDate.getMonth() === month &&
                        selectedDate.getDate() === day
                    ) {
                        el.classList.add('active');
                    }
        
                    grid.appendChild(el);
                }
        
                renderTasksForDay(selectedDate);
            }
        
            // -----------------------
            // selected day function
            // -----------------------
            function selectDay(year, month, day, element) {
                document.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
                element.classList.add('active');
        
                selectedDate = new Date(year, month, day);
                renderTasksForDay(selectedDate);
            }
        
            // -----------------------
            // tasks for selected day
            // -----------------------
            function renderTasksForDay(date) {
                const title = document.getElementById('taskDateTitle');
                const list = document.getElementById('taskList');
        
                const key = formatDateKey(date);
                title.textContent = `Tasks for ${date.toDateString()}`;
                list.innerHTML = '';
        
                (tasks[key] || []).forEach(task => {
                    const li = document.createElement('li');
                    li.textContent = task;
                    list.appendChild(li);
                });
            }
        
            // -----------------------
            // month arrows navigation
            // -----------------------
            document.getElementById('prevMonth').onclick = () => {
                date.setMonth(date.getMonth() - 1);
                renderCalendar();
            };
        
            document.getElementById('nextMonth').onclick = () => {
                date.setMonth(date.getMonth() + 1);
                renderCalendar();
            };
        
          
            renderCalendar();
        </script>

        <!-- im gonna update that later -->
        <script src="./app.js"></script>

        <script>
            if('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('SW register success', reg.scope))
                        .catch(err => console.error('SW register failed', err))
                })
            }
        </script>
    </body>
</html>
