<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Habit Bubble logo">
  <defs>
    <radialGradient id="bubble-lg" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble-md" cx="60%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble-sm" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App background (omit for transparent export) -->
  <rect width="512" height="512" rx="112" fill="#17181f"/>

  <!-- Large bubble  top right (like body::before) -->
  <g filter="url(#glow)">
    <circle cx="340" cy="168" r="118" fill="url(#bubble-lg)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <ellipse cx="302" cy="128" rx="36" ry="22" fill="rgba(255,255,255,0.22)" transform="rotate(-18 302 128)"/>
  </g>

  <!-- Medium bubble  bottom left (like body::after) -->
  <g filter="url(#glow)">
    <circle cx="148" cy="348" r="96" fill="url(#bubble-md)" stroke="rgba(255,255,255,0.24)" stroke-width="2"/>
    <ellipse cx="118" cy="318" rx="28" ry="16" fill="rgba(255,255,255,0.18)" transform="rotate(-12 118 318)"/>
  </g>

  <!-- Small bubble  center (like #main-content::before) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="268" r="72" fill="url(#bubble-sm)" stroke="rgba(255,255,255,0.32)" stroke-width="2"/>
    <ellipse cx="234" cy="246" rx="22" ry="13" fill="rgba(255,255,255,0.2)" transform="rotate(-10 234 246)"/>
  </g>
</svg>
