<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="lg" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="md" cx="58%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sm" cx="40%" cy="34%" r="68%">
