<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Turn your big ambitions into reality. Set long-term goals, monitor stats of your own Hero, and visualize your journey toward personal excellence."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Hero - Habit Bubble</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="offline-banner">
      Brak połączenia z internetem. Aplikacja działa w trybie offline!
    </div>
    <header class="navbar">
      <a href="/index.html" class="logo" aria-label="Habit Bubbl">
        <img
          src="./assets/logo-transparent.png"
          alt=""
          class="logo-img"
          width="64"
          height="64"
        />
      </a>
      <nav class="tabNav">
        <a href="/index.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-list-todo-icon lucide-list-todo"
          >
            <path d="M13 5h8" />
            <path d="M13 12h8" />
            <path d="M13 19h8" />
            <path d="m3 17 2 2 4-4" />
            <rect x="3" y="4" width="6" height="6" rx="1" />
          </svg>
          Today
        </a>
        <a href="/calendar.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-calendar-days"
          >
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          Calendar
        </a>
        <a href="/habits.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-flame-icon lucide-flame"
          >
            <path
              d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            />
          </svg>
          Habits
        </a>
        <a href="/hero.html" class="tabNavItemSelected">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-user-icon lucide-user"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Hero
        </a>
      </nav>
    </header>

    <main id="main-content">
      <!-- User -->
      <div class="userStats">
        <div class="userWrapper">
          <div class="usernameWrapper">
            <h3 id="displayUserName"><span>User name</span></h3>
            <input type="text" id="userNameInput" style="display: none" />
            <button id="editUserName" aria-label="Edit user name">
              <svg
                style="margin-top: 4px"
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#ddd"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-pencil-icon lucide-pencil"
              >
                <path
                  d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
                />
                <path d="m15 5 4 4" />
              </svg>
            </button>
          </div>
          <div class="permissions">
            <!--<h3>App Permissions</h3>-->
            <div class="permission-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-bell-icon lucide-bell"
              >
                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path
                  d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
                />
              </svg>
              <label id="toggleLabel" for="toggleNotifications"
                >Notifications</label
              >
              <label class="switch">
                <input type="checkbox" id="toggleNotifications" />
                <span class="slider round"></span>
              </label>
            </div>
            <div class="permission-item">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-map-pin-icon lucide-map-pin"
              >
                <path
                  d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
                />
                <circle cx="12" cy="10" r="3" />
              </svg>
              <label id="toggleLabel" for="toggleLocation">Location</label>
              <label class="switch">
                <input type="checkbox" id="toggleLocation" />
                <span class="slider round"></span>
              </label>
            </div>
          </div>
        </div>
        <div class="levelWrapper">
          <div class="heroLvlWrapper">
            <span id="user-level-value">0</span>
          </div>
          <div class="levelIndicatorWrapper">
            <span id="currentLevel">0</span>
            <div class="levelIndicator">
              <div id="xp-progress-bar"></div>
            </div>
            <span class="nextLevel" id="next-level-value">1</span>
          </div>
          <div class="nextLevelWrapper">
            <div class="nextLevelXpNeeded" id="xp-next-level">100/100</div>
          </div>
          <div class="totalXpWrapper">
            Total XP gained:
            <span id="total-xp-value">0</span>
          </div>
        </div>
      </div>
      <!-- GOALS -->
      <div class="goalsContainer">
        <h3 class="longTermGoalsTitle">Long-term Goals</h3>
        <div id="emptyListMessageWrapper" style="display: none">
          <span id="messageGoals" class="emptyListMessage"
            >No goals yet! Add one and improve Your daily life.</span
          >
        </div>
        <ul id="goalsList" class="toDoList"></ul>
      </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <header class="modal-header">
          <div class="typePickersWrapper">
            <h3 id="modalTitle">New</h3>
            <div class="typePickers">
              <button class="typePicker" data-type="task">Task</button>
              <button class="typePicker" data-type="habit">Habit</button>
              <button class="typePicker" data-type="goal">Goal</button>
            </div>
          </div>
          <button id="closeModal" aria-label="Close modal">✕</button>
        </header>

        <div id="modalMessageWrapper" style="display: none">
          <span id="modalMessage" class="modalMessage">message</span>
        </div>

        <div class="nameSection">
          <label class="modalSubTitle" for="taskName">Name</label>
          <input
            type="text"
            placeholder="Enter name"
            id="taskName"
            name="taskName"
            enterkeyhint="done"
          />
        </div>

        <div id="habitSection" style="display: none">
          <div
            id="habitIconWrapper"
            style="display: flex; flex-direction: column"
          >
            <label class="modalSubTitle">Icon</label>
            <input
              type="text"
              id="habitIcon"
              placeholder="★"
              name="habitIcon"
              maxlength="2"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div style="display: flex; flex-direction: column">
            <label class="modalSubTitle">Frequency</label>
            <select id="habitFrequency">
              <option value="daily">Everyday</option>
              <option value="weekly">Select days of the week</option>
              <option value="monthly">Select days of the month</option>
            </select>

            <div id="daysPicker" style="display: none">
              <label
                ><input type="checkbox" name="habitDays" value="1" /> MON
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="2" /> TUE
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="3" /> WED
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="4" /> THU
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="5" /> FRI
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="6" /> SAT
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="0" /> SUN
              </label>
            </div>

            <div id="monthlyDayPicker" style="display: none">
              <div id="monthDaysGrid" class="month-selector-grid"></div>
            </div>
          </div>
        </div>

        <div id="goalSection" style="display: none">
          <div class="deadlinePlusLinkHabit">
            <div class="deadlineSection">
              <label class="modalSubTitle">Deadline</label>
              <input type="date" id="goalDeadline" name="goalDeadline" />
            </div>

            <div class="linkHabitSection">
              <label class="modalSubTitle"
                >Link Habit - make goal measurable</label
              >
              <select id="goalHabitSelect" name="goalHabitSelect">
                <option value="">No linked habit</option>
              </select>
            </div>
          </div>
          <div class="descriptionSection">
            <label class="modalSubTitle">Description</label>
            <textarea
              id="descriptionInput"
              name="descriptionInput"
              placeholder="Any more details about your goal?"
            ></textarea>
          </div>
        </div>

        <div id="dateSection">
          <label class="modalSubTitle" for="taskDate">Date</label>
          <input type="date" id="taskDate" name="taskDate" />
        </div>
        <div class="locationSection" id="locationSection">
          <label class="modalSubTitle">Location</label>
          <div class="locationContentWrapper">
            <input
              type="text"
              id="locationInput"
              name="locationInput"
              placeholder="Enter location"
              enterkeyhint="search"
            />
            <button id="searchLocation" aria-label="Search location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide-search-check"
              >
                <path d="m8 11 2 2 4-4" />
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </button>
            <button id="useMyLocation" aria-label="Use my current location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide-locate"
              >
                <line x1="2" x2="5" y1="12" y2="12" />
                <line x1="19" x2="22" y1="12" y2="12" />
                <line x1="12" x2="12" y1="2" y2="5" />
                <line x1="12" x2="12" y1="19" y2="22" />
                <circle cx="12" cy="12" r="7" />
              </svg>
              <!--Current Location-->
            </button>
          </div>
        </div>

        <button class="addTask" id="confirmAddBtn">Create</button>
      </div>
    </div>

    <button
      type="button"
      id="addTaskBtn"
      class="addTaskBtn"
      aria-label="Add new task"
    >
      +
    </button>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
