<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Turn your big ambitions into reality. Set long-term goals, monitor stats of your own Hero, and visualize your journey toward personal excellence.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero - Habit Hero</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">Habit Hero</h1>
      <nav class="tabNav">
        <a href="/index.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-clipboard-check"
          >
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            />
            <path d="m9 14 2 2 4-4" />
          </svg>
          Today
        </a>
        <a href="/calendar.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-calendar-days"
          >
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          Calendar
        </a>
        <a href="/habits.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-flame-icon lucide-flame"
          >
            <path
              d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            />
          </svg>
          Habits
        </a>
        <a href="/hero.html" class="tabNavItemSelected">
          <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="20" 
          height="20" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          class="lucide lucide-user-icon lucide-user">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Hero
        </a>
      </nav>
    </header>

    <div class="helper320">
    </div>

    <div class="userStats">
      <div class="usernameWrapper">
        <h3>User name</h3>
        <button>edit</button>
      </div>
      <div class="levelWrapper">
        <div>Level: <span>0</span></div>
        <div class="levelIndicator"></div>
        <span class="nextLevel">1</span>
      </div>
      <div>Total XP gained: <span>0</span></div>
    </div>


    <!-- MODAL -->
    <button id="addTaskBtn" class="addTaskBtn"> + </button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet">
            <header class="modal-header">
                <div class="typePickers">
                    <h3>Add new</h3>
                    <button class="typePicker" data-type="task">Task</button>
                    <button class="typePicker" data-type="habit">Habit</button>
                    <button class="typePicker" data-type="goal">Goal</button>
                </div>
                <button id="closeModal">✕</button>
            </header>
      
            <div id="habitSection" style="display:none;">
              <select id="habitFrequency">
                <option value="daily">Everyday</option>
                <option value="weekly">Select days of the week</option>
                <option value="monthly">Select days of the month</option>
              </select>
                
              <div id="daysPicker" style="display:none;">
                <label><input type="checkbox" value="1"> MON </label>
                <label><input type="checkbox" value="2"> TUE </label>
                <label><input type="checkbox" value="3"> WED </label>
                <label><input type="checkbox" value="4"> THU </label>
                <label><input type="checkbox" value="5"> FRI </label>
                <label><input type="checkbox" value="6"> SAT </label>
                <label><input type="checkbox" value="0"> SUN </label>
              </div>

              <div id="monthlyDayPicker" style="display:none;">
                <div id="monthDaysGrid" class="month-selector-grid">
                </div>
              </div>
            </div>
        
            <input type="text" placeholder="Task name" id="taskName" />
            <div id="taskDateSection">
                <input type="date" id="taskDate" />
            </div>
            <div style="flex: 1">
                <input
                    type="text"
                    id="locationInput"
                    placeholder="Enter location"
                />
                <button id="searchLocation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-search-check">
                        <path d="m8 11 2 2 4-4"/>
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                </button>
                <button id="useMyLocation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-locate">
                        <line x1="2" x2="5" y1="12" y2="12"/>
                        <line x1="19" x2="22" y1="12" y2="12"/>
                        <line x1="12" x2="12" y1="2" y2="5"/>
                        <line x1="12" x2="12" y1="19" y2="22"/>
                        <circle cx="12" cy="12" r="7"/>
                    </svg>
                    Current Location
                </button>
            </div>

            <button class="addTask">Add</button>
        </div>
    </div>

    <script src="./app.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW register success", reg.scope))
            .catch((err) => console.error("SW register failed", err));
        });
      }
    </script>
  </body>
</html>
