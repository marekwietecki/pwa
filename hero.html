<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Turn your big ambitions into reality. Set long-term goals, monitor stats of your own Hero, and visualize your journey toward personal excellence.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>Hero - Habit Hero</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">Habit Hero</h1>
      <nav class="tabNav">
        <a href="/index.html" class="tabNavItem">
          <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="20" 
          height="20" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          class="lucide lucide-list-todo-icon lucide-list-todo">
          <path d="M13 5h8"/>
          <path d="M13 12h8"/>
            <path d="M13 19h8"/>
            <path d="m3 17 2 2 4-4"/>
            <rect x="3" y="4" width="6" height="6" rx="1"/>
          </svg>
          Today
        </a>
        <a href="/calendar.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-calendar-days"
          >
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          Calendar
        </a>
        <a href="/habits.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-flame-icon lucide-flame"
          >
            <path
              d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            />
          </svg>
          Habits
        </a>
        <a href="/hero.html" class="tabNavItemSelected">
          <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="20" 
          height="20" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          class="lucide lucide-user-icon lucide-user">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Hero
        </a>
      </nav>
    </header>


    <div class="userStats">
      <div class="userWrapper">
        <div class="usernameWrapper">       
          <h3 id="displayUserName">User name</h3>
          <input type="text" id="userNameInput" style="display: none;" />
          <button id="editUserName">
            <svg style="margin-top: 4px" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
          </button>
        </div>
        <div class="totalXpWrapper">
          XP Gained in total:
          <span id="total-xp-value">0</span>
        </div>
        <div class="heroLvlWrapper">
          Hero Experience lvl: <span id="user-level-value">0</span>
        </div>
      </div>
      <div class="levelWrapper">
        <div class="levelIndicatorWrapper">
          <span id="currentLevel">0</span>
          <div class="levelIndicator">
            <div id="xp-progress-bar"></div>
          </div>
          <span class="nextLevel" id="next-level-value">1</span>
        </div>    
        <div class="nextLevelWrapper">
          <div class="nextLevelXpNeeded" id="xp-next-level">100/100</div>
        </div>
      </div>
    </div>

    <div class="goalsContainer">
      <h3 class="sectionTitle">Long-term Goals</h3>
      <div id="emptyListMessageWrapper" style="display: none;">
        <span id="messageGoals" class="emptyListMessage">No goals yet! Add one and improve Your daily life.</span>
      </div>
      <ul id="goalsList" class="toDoList">
      </ul>
    </div>


       <!-- MODAL -->
       <button id="addTaskBtn" class="addTaskBtn"> + </button>

       <div class="modal-overlay" id="modalOverlay">
         <div class="modal-sheet">
           <header class="modal-header">
             <div class="typePickersWrapper">
               <h3 id="modalTitle">New</h3>
                 <div class="typePickers">
                   <button class="typePicker" data-type="task">Task</button>
                   <button class="typePicker" data-type="habit">Habit</button>
                   <button class="typePicker" data-type="goal">Goal</button>
                 </div>
             </div>
             <button id="closeModal">✕</button>
           </header>
   
           <div id="modalMessageWrapper" style="display: none;">
             <span id="modalMessage" class="modalMessage">message</span>
           </div>
     
           <div class="nameSection">    
             <span class="modalSubTitle">Name</span>
             <input type="text" placeholder="Enter name" id="taskName" name="taskName" />
           </div>
   
           <div id="habitSection" style="display:none;">
             <div id="habitIconWrapper" style="display: flex; flex-direction: column;">
               <span class="modalSubTitle">Icon</span>
               <input type="text" id="habitIcon" placeholder="★" name="habitIcon" maxlength="2" autocomplete="off" spellcheck="false"/>
             </div>
             <div style="display: flex; flex-direction: column;">
               <span class="modalSubTitle">Frequency</span>
               <select id="habitFrequency">
                 <option value="daily">Everyday</option>
                 <option value="weekly">Select days of the week</option>
                 <option value="monthly">Select days of the month</option>
               </select>
                 
               <div id="daysPicker" style="display:none;">
                 <label><input type="checkbox" name="habitDays" value="1"> MON </label>
                 <label><input type="checkbox" name="habitDays" value="2"> TUE </label>
                 <label><input type="checkbox" name="habitDays" value="3"> WED </label>
                 <label><input type="checkbox" name="habitDays" value="4"> THU </label>
                 <label><input type="checkbox" name="habitDays" value="5"> FRI </label>
                 <label><input type="checkbox" name="habitDays" value="6"> SAT </label>
                 <label><input type="checkbox" name="habitDays" value="0"> SUN </label>
               </div>
   
               <div id="monthlyDayPicker" style="display:none;">
                 <div id="monthDaysGrid" class="month-selector-grid">
                 </div>
               </div>
             </div>
           </div>
   
           <div id="goalSection" style="display:none;">
             <div class="deadlinePlusLinkHabit">  
               <div class="deadlineSection">
                 <span class="modalSubTitle">Deadline</span>
                 <input type="date" id="goalDeadline" name="goalDeadline"/>
               </div>
         
               <div class="linkHabitSection">
                 <span class="modalSubTitle">Link Habit - make goal measurable</span>
                 <select id="goalHabitSelect" name="goalHabitSelect">
                   <option value="">No linked habit</option>
                 </select>
               </div>
             </div>
             <div class="descriptionSection">
               <span class="modalSubTitle">Description</span>
               <textarea id="descriptionInput" name="descriptionInput" placeholder="Any more details about your goal?"></textarea>
             </div>
           </div>
           
           <div id="dateSection">
             <span class="modalSubTitle">Date</span>
             <input type="date" id="taskDate" name="taskDate"/>
           </div>
           <div class="locationSection" id="locationSection">
             <span class="modalSubTitle">Location</span>
             <div class="locationContentWrapper">  
               <input
                   type="text"
                   id="locationInput"
                   name="locationInput"
                   placeholder="Enter location"
               />
               <button id="searchLocation">
                   <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-search-check">
                       <path d="m8 11 2 2 4-4"/>
                       <circle cx="11" cy="11" r="8"/>
                       <path d="m21 21-4.3-4.3"/>
                   </svg>
               </button>
               <button id="useMyLocation">
                   <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-locate">
                       <line x1="2" x2="5" y1="12" y2="12"/>
                       <line x1="19" x2="22" y1="12" y2="12"/>
                       <line x1="12" x2="12" y1="2" y2="5"/>
                       <line x1="12" x2="12" y1="19" y2="22"/>
                       <circle cx="12" cy="12" r="7"/>
                   </svg>
                   <!--Current Location-->
               </button>
             </div>
           </div>
   
           <button class="addTask" id="confirmAddBtn">Create</button>
         </div>
       </div>

    <script src="./app.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW register success", reg.scope))
            .catch((err) => console.error("SW register failed", err));
        });
      }
    </script>
  </body>
</html>
