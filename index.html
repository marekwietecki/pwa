<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Master your daily productivity with Habit Bubble. Track daily tasks, complete habits in real-time, set your long-term goals, and stay organized with a sleek, intuitive dashboard built for productivity."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Today - Habit Bubbl" />
    <meta
      property="og:description"
      content="Master your daily productivity with Habit Bubbl. Track daily tasks, complete habits in real-time."
    />
    <meta property="og:url" content="https://habitbubbl.netlify.app/" />
    <meta
      property="og:image"
      content="https://habitbubbl.netlify.app/assets/graphics/og-image-today.webp"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Today - Habit Bubbl" />
    <meta
      name="twitter:description"
      content="Master your daily productivity with Habit Bubbl. Track daily tasks, complete habits in real-time."
    />
    <meta
      name="twitter:image"
      content="https://habitbubbl.netlify.app/assets/graphics/og-image-today.webp"
    />
    <title>Today - Habit Bubbl</title>
    <link rel="stylesheet" href="./css/global.min.css" />
    <link rel="stylesheet" href="./css/index.min.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/icons/habitbubbl-favicon.svg"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/assets/icons/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div
      id="app-splash-screen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #121318;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease, transform 0.5s ease;
      "
    >
      <img
        src="./assets/icons/logo-transparent.webp"
        alt="Habit Bubbl"
        style="
          width: 120px;
          height: 120px;
          animation: pulse 2s infinite ease-in-out;
        "
      />
      <style>
        @keyframes pulse {
          0% {
            transform: scale(0.95);
            opacity: 0.8;
          }
          50% {
            transform: scale(1.05);
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.3));
          }
          100% {
            transform: scale(0.95);
            opacity: 0.8;
          }
        }
      </style>
    </div>
    <script>
      // 🔥 TRICK UX: Jeśli to nie jest pierwsze odpalenie w tej sesji, natychmiast usuń splash, żeby nie mignął
      if (sessionStorage.getItem("splash_shown") === "true") {
        const quickSplash = document.getElementById("app-splash-screen");
        if (quickSplash) quickSplash.remove();
      }
    </script>

    <div id="offline-banner">
      No internet connection. App is working in an offline mode.
    </div>
    <header class="navbar">
      <a href="/index.html" class="logo" aria-label="Habit Bubbl">
        <img
          src="./assets/icons/logo-transparent.webp"
          alt=""
          class="logo-img"
          width="64"
          height="64"
        />
      </a>
      <nav class="tabNav">
        <div class="tabNavIndicator" id="tabIndicator"></div>
        <a href="/index.html" class="tabNavItem active">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-list-todo-icon lucide-list-todo"
          >
            <path d="M13 5h8" />
            <path d="M13 12h8" />
            <path d="M13 19h8" />
            <path d="m3 17 2 2 4-4" />
            <rect x="3" y="4" width="6" height="6" rx="1" />
          </svg>
          Today
        </a>
        <a href="/calendar.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-calendar-days"
          >
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          Calendar
        </a>
        <a href="/habits.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-flame-icon lucide-flame"
          >
            <path
              d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            />
          </svg>
          Habits
        </a>
        <a href="/hero.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-user-icon lucide-user"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Hero
        </a>
      </nav>
    </header>
    <main id="main-content">
      <!-- MOTIVATION & INSTALL -->
      <!-- <section class="quote">
        <div id="quote-container">
          <p id="quote-text">Loading motivation...</p>
          <small id="quote-author"></small>
        </div>
      </section> -->
      <section id="hero-dynamic-card" class="dynamic-card"></section>

      <!-- TO DO -->
      <section class="toDo">
        <h3 id="taskDateTitle">To do today:</h3>
        <div class="toDoListWrapper">
          <div id="emptyListMessageWrapper" class="emptyState" style="display: none">
            <div class="emptyState-icon">🎉</div>
            <p id="messageToday" class="emptyState-title">All tasks done!</p>
            <p class="emptyState-subtitle">Keep it up, you're on a roll.</p>
          </div>
          <ul id="toDoList"></ul>
        </div>
      </section>
    </main>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <header class="modal-header">
          <div class="typePickersWrapper">
            <h3 id="modalTitle">New</h3>
            <div class="typePickers">
              <button class="typePicker" data-type="task">Task</button>
              <button class="typePicker" data-type="habit">Habit</button>
              <button class="typePicker" data-type="goal">Goal</button>
            </div>
          </div>
          <button id="closeModal" aria-label="Close modal">✕</button>
        </header>

        <div id="modalMessageWrapper" style="display: none">
          <span id="modalMessage" class="modalMessage">message</span>
        </div>

        <div class="nameSection">
          <label class="modalSubTitle" for="taskName">Name</label>
          <div class="taskNameWrap">
            <div id="taskNameGhost" class="taskNameGhost" aria-hidden="true"></div>
            <input
              type="text"
              placeholder="Enter name"
              id="taskName"
              name="taskName"
              enterkeyhint="done"
              autocomplete="off"
            />
          </div>
        </div>

        <div id="habitSection" style="display: none">
          <div
            id="habitIconWrapper"
            style="display: flex; flex-direction: column"
          >
            <label class="modalSubTitle" for="habitIcon">Icon</label>
            <input
              type="text"
              id="habitIcon"
              placeholder="★"
              name="habitIcon"
              maxlength="2"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div style="display: flex; flex-direction: column">
            <label class="modalSubTitle" for="habitFrequency">Frequency</label>
            <select id="habitFrequency">
              <option value="daily">Everyday</option>
              <option value="weekly">Select days of the week</option>
              <option value="monthly">Select days of the month</option>
            </select>

            <div id="daysPicker" style="display: none">
              <label
                ><input type="checkbox" name="habitDays" value="1" /> MON
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="2" /> TUE
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="3" /> WED
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="4" /> THU
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="5" /> FRI
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="6" /> SAT
              </label>
              <label
                ><input type="checkbox" name="habitDays" value="0" /> SUN
              </label>
            </div>

            <div id="monthlyDayPicker" style="display: none">
              <div id="monthDaysGrid" class="month-selector-grid"></div>
            </div>
          </div>

          <div class="measurableSection">
            <div class="quantitySection">
              <label class="modalSubTitle" for="habitTargetQuantity"
                >Target quantity (optional)</label
              >
              <input
                type="number"
                id="habitTargetQuantity"
                class="modal-text-input"
                min="1"
                step="1"
                placeholder="e.g. 10"
              />
            </div>
            <div class="unitSection">
              <label class="modalSubTitle">Unit</label>
              <div id="habitUnitPicker" class="unit-picker-list">
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="mins" />
                  <span>mins</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="hours" />
                  <span>hours</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="reps" />
                  <span>reps</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="pages" />
                  <span>pages</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="steps" />
                  <span>steps</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="km" />
                  <span>km</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="glasses" />
                  <span>glasses</span>
                </label>
                <label class="unit-picker-option">
                  <input type="radio" name="habitUnit" value="times" />
                  <span>times</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div id="goalSection" style="display: none">
          <div class="deadlinePlusLinkHabit">
            <div class="deadlineSection">
              <label class="modalSubTitle" for="goalDeadline">Deadline</label>
              <input type="date" id="goalDeadline" name="goalDeadline" />
            </div>

            <div class="linkHabitSection">
              <label class="modalSubTitle"
                >Link Habits - make goal measurable</label
              >
              <button
                type="button"
                id="goalHabitToggleBtn"
                class="habit-picker-toggle"
              >
                Select habits to link
              </button>
              <div
                id="goalHabitCheckboxList"
                class="habit-checkbox-list"
                hidden
              ></div>
            </div>
          </div>
          <div class="descriptionSection">
            <label class="modalSubTitle" for="descriptionInput">Description</label>
            <textarea
              id="descriptionInput"
              name="descriptionInput"
              placeholder="Any more details about your goal?"
            ></textarea>
          </div>
        </div>

        <div id="taskTemplateSection" style="display: none">
          <label class="modalSubTitle">Templates</label>
          <div class="locationContentWrapper">
            <div
              class="habit-dropdown-container"
              id="taskTemplateDropdownContainer"
              style="display: none"
            >
              <div
                class="habit-dropdown-trigger"
                id="taskTemplateDropdownTrigger"
              >
                <div class="habit-dropdown-current">
                  <span class="habit-item-name">Use a saved template</span>
                </div>
                <svg
                  class="dropdown-chevron"
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </div>
              <div
                class="habit-dropdown-list"
                id="taskTemplateDropdownList"
                tabindex="0"
              ></div>
            </div>
            <button
              type="button"
              id="saveTaskTemplateBtn"
              aria-label="Save as template"
              title="Save as template"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="dateSection">
          <label class="modalSubTitle" for="taskDate">Date</label>
          <input type="date" id="taskDate" name="taskDate" />
        </div>
        <div class="locationSection" id="locationSection">
          <label class="modalSubTitle" for="locationInput">Location</label>
          <div class="locationContentWrapper">
            <input
              type="text"
              id="locationInput"
              name="locationInput"
              placeholder="Enter location"
              enterkeyhint="search"
            />
            <button id="searchLocation" aria-label="Search location" title="Search location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide-search-check"
              >
                <path d="m8 11 2 2 4-4" />
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </button>
            <button id="useMyLocation" aria-label="Use my current location" title="Use my current location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide-locate"
              >
                <line x1="2" x2="5" y1="12" y2="12" />
                <line x1="19" x2="22" y1="12" y2="12" />
                <line x1="12" x2="12" y1="2" y2="5" />
                <line x1="12" x2="12" y1="19" y2="22" />
                <circle cx="12" cy="12" r="7" />
              </svg>
              <!--Current Location-->
            </button>
          </div>
        </div>

        <button class="addTask" id="confirmAddBtn">Create</button>
      </div>
    </div>

    <button
      type="button"
      id="addTaskBtn"
      class="addTaskBtn"
      aria-label="Add new task"
    >
      +
    </button>

    <div id="levelUpToast" class="level-up-toast">
      <div class="level-up-glow"></div>
      <div class="level-up-content">
        <div class="level-up-icon">🫧</div>
        <div class="level-up-text">
          <span class="level-up-subtitle">LEVEL UP!</span>
          <span class="level-up-title">You just achieved higher level!</span>
        </div>
      </div>
    </div>

    <div class="modal-overlay confirm-dialog-overlay" id="confirmDialogOverlay">
      <div class="modal-sheet confirm-dialog-sheet">
        <p id="confirmDialogMessage" class="confirm-dialog-message"></p>
        <div class="confirm-dialog-actions">
          <button
            type="button"
            id="confirmDialogCancelBtn"
            class="confirm-dialog-btn confirm-dialog-cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            id="confirmDialogConfirmBtn"
            class="confirm-dialog-btn confirm-dialog-confirm"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="habitProgressOverlay">
      <div class="modal-sheet habit-progress-sheet">
        <div class="habit-progress-header-row">
          <div class="habit-progress-header">
            <span id="habitProgressIcon" class="habit-progress-icon">💧</span>
            <h3 id="habitProgressName" class="habit-progress-name">Habit</h3>
          </div>
          <div class="habit-progress-header-actions">
            <button
              type="button"
              id="habitProgressEditBtn"
              class="habit-progress-icon-btn"
              aria-label="Edit"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
                />
                <path d="m15 5 4 4" />
              </svg>
            </button>
            <button
              type="button"
              id="habitProgressDeleteBtn"
              class="habit-progress-icon-btn habit-progress-delete-btn"
              aria-label="Delete"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#ff4444"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </button>
          </div>
        </div>
        <p class="habit-progress-date" id="habitProgressDateLabel"></p>

        <div id="habitProgressProgressSection">
          <div class="habit-progress-track">
            <div id="habitProgressBarFill" class="habit-progress-fill"></div>
          </div>

          <div class="habit-progress-stepper">
            <button
              type="button"
              id="habitProgressDecBtn"
              class="habit-progress-step-btn"
              aria-label="Decrease"
            >
              −
            </button>
            <div class="habit-progress-amount-wrap">
              <input
                type="number"
                id="habitProgressAmountInput"
                class="habit-progress-amount-input"
                min="0"
              />
              <span class="habit-progress-target-label"
                >/ <span id="habitProgressTarget"></span>
                <span id="habitProgressUnit"></span
              ></span>
            </div>
            <button
              type="button"
              id="habitProgressIncBtn"
              class="habit-progress-step-btn"
              aria-label="Increase"
            >
              +
            </button>
          </div>
        </div>

        <div class="confirm-dialog-actions">
          <button
            type="button"
            id="habitProgressCancelBtn"
            class="confirm-dialog-btn confirm-dialog-cancel"
          >
            Cancel
          </button>
          <button
            type="button"
            id="habitProgressSaveBtn"
            class="confirm-dialog-btn confirm-dialog-confirm"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
