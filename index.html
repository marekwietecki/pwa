<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Hero - To Do</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <header class="navbar">
      <h1 class="logo">Habit Hero</h1>
      <nav class="tabNav">
        <a href="/index.html" class="tabNavItemSelected">
          <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="20" 
          height="20" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          class="lucide lucide-list-todo-icon lucide-list-todo">
          <path d="M13 5h8"/>
          <path d="M13 12h8"/>
            <path d="M13 19h8"/>
            <path d="m3 17 2 2 4-4"/>
            <rect x="3" y="4" width="6" height="6" rx="1"/>
          </svg>
          Today
        </a>
        <a href="/calendar.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="navIcon"
            id="lucide-calendar-days"
          >
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <rect width="18" height="18" x="3" y="4" rx="2" />
            <path d="M3 10h18" />
            <path d="M8 14h.01" />
            <path d="M12 14h.01" />
            <path d="M16 14h.01" />
            <path d="M8 18h.01" />
            <path d="M12 18h.01" />
            <path d="M16 18h.01" />
          </svg>
          Calendar
        </a>
        <a href="/habits.html" class="tabNavItem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-flame-icon lucide-flame"
          >
            <path
              d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
            />
          </svg>
          Habits
        </a>
        <a href="/hero.html" class="tabNavItem">
          <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="20" 
          height="20" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          class="lucide lucide-user-icon lucide-user">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Hero
        </a>
      </nav>
    </header>

    <div class="helper320"></div>

    <section class="toDo">
      <h3 id="taskDateTitle"></h3>
      <div class="toDoListWrapper">
        <ul id="toDoList"></ul>
      </div>
    </section>

    <button id="addTaskBtn" class="addTaskBtn">+</button>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <header class="modal-header">
          <h3>Add task</h3>
          <button id="closeModal">✕</button>
        </header>

        <div style="display: flex; flex-direction: row;">
          <label for="taskType">Type:</label>
          <select id="taskType">
            <option value="task">One-time Task</option>
            <option value="habit">Daily Habit</option>
          </select>
        </div>

        

        <div id="habitSection" style="display:none;">
          <select id="habitFrequency">
            <option value="daily">Codziennie</option>
            <option value="weekly">Raz w tygodniu</option>
            <option value="monthly">Raz w miesiącu</option>
            <option value="specific">Konkretne dni tygodnia</option>
          </select>
        
          <div id="daysPicker" style="display:none;">
            <label><input type="checkbox" value="1"> Pon</label>
            <label><input type="checkbox" value="2"> Wt</label>
            <label><input type="checkbox" value="3"> Śr</label>
            <label><input type="checkbox" value="4"> Czw</label>
            <label><input type="checkbox" value="5"> Pt</label>
            <label><input type="checkbox" value="6"> Sob</label>
            <label><input type="checkbox" value="0"> Niedz</label>
          </div>
        </div>

        <input type="text" placeholder="Task name" id="taskName" />
        <div id="taskDateSection"> 
          <input type="date" id="taskDate" />
        </div>        
        <div style="flex: 1">
          <input
            type="text"
            id="locationInput"
            placeholder="Enter location (e.g. Hanna, Lubuskie)"
          />
          <button id="searchLocation">✔️</button>
          <button id="useMyLocation">📍 Current Location</button>
        </div>

        <button class="addTask">Add</button>
      </div>
    </div>       

    

    <!-- im gonna update that later -->
    <script src="./app.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW register success", reg.scope))
            .catch((err) => console.error("SW register failed", err));
        });
      }
    </script>
  </body>
</html>
